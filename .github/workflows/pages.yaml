#
# Publishes the feed, the vex/ folder, at the root of the GitHub Pages site of this
# repository, and the stats page, the stats/ folder, under /stats/ (Francesco, 27 Oct
# 2026). Nothing else is published. The site is served at the custom domain set in the
# repository's Pages settings.
name: pages

# Runs when a push to main changes vex/ or stats/, which the feed reconciler and the stats
# Job write by pull request, and by hand. One deployment at a time, the last one wins,
# none is cancelled half way.
on:
  push:
    branches:
      - main
    paths:
      - "vex/**"
      - "stats/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read vex/ and stats/ at the pushed commit
      pages: write # deploy the site
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 1. Pages is set to publish from GitHub Actions.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # 2. The site: vex/ at the root, stats/ under /stats/ once the stats Job has written it.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir _site
          cp -a vex/. _site/
          if [ -d stats ]
          then
            mkdir _site/stats
            cp -a stats/. _site/stats/
          fi

      # 3. Only the assembled site is uploaded. Hidden files are included so
      #    .well-known/vex-repository.json, the manifest Trivy asks for, is published.
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      # 4. The upload becomes the site.
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
